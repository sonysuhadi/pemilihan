<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Hasil Pemilihan HIMATEKKOM</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { 
          ink: '#060B14', surface: '#0F1826', surface2: '#16213A', 
          hairline: '#22304A', cyan: '#4CE0C7', amber: '#F5B942', muted: '#7C8AAE' 
        },
        fontFamily: { 
          display: ['"Space Grotesk"', 'sans-serif'], 
          body: ['Inter', 'sans-serif'], 
          mono: ['"JetBrains Mono"', 'monospace'] 
        },
      },
    },
  };
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { background-color: #060B14; }
  .circuit-bg {
    background-image: linear-gradient(#1B2740 1px, transparent 1px), linear-gradient(90deg, #1B2740 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 30%, transparent 85%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 30%, transparent 85%);
  }
  .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(76,224,199,.55);} 50% { box-shadow: 0 0 0 6px rgba(76,224,199,0);} }
  .bar-fill { transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
  .bar-glow { box-shadow: 0 0 14px 0 rgba(76,224,199,0.4); }
</style>
</head>

<body class="font-body text-[#EDF2FF] min-h-screen">

  <!-- ============ LOGIN SCREEN ============ -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4 relative overflow-hidden">
    <div class="absolute inset-0 circuit-bg pointer-events-none"></div>
    <div class="relative w-full max-w-sm">
      <div class="flex items-center gap-2 text-xs font-mono text-cyan mb-6 justify-center">
        <span class="w-2 h-2 rounded-full bg-cyan pulse-dot"></span>
        <span>AKSES_TERBATAS</span>
      </div>
      <div class="bg-surface border border-hairline rounded-xl p-7">
        <h1 class="font-display text-2xl text-white mb-1">Dashboard Admin</h1>
        <p class="text-sm text-muted mb-6">Masuk untuk melihat rekap suara HIMATEKKOM.</p>
        
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-mono text-muted mb-1.5" for="login-email">Email</label>
            <input id="login-email" type="email" required placeholder="admin@himatekkom.org" 
              class="w-full bg-surface2 border border-hairline rounded-md px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan" />
          </div>
          <div>
            <label class="block text-xs font-mono text-muted mb-1.5" for="login-password">Password</label>
            <input id="login-password" type="password" required placeholder="••••••••" 
              class="w-full bg-surface2 border border-hairline rounded-md px-3 py-2.5 text-sm text-white focus:outline-none focus:border-cyan" />
          </div>

          <p id="login-message" class="text-xs font-mono text-red-400 hidden"></p>

          <button id="btn-login" type="submit" 
            class="w-full py-2.5 rounded-md bg-cyan text-ink font-semibold text-sm hover:brightness-110 transition disabled:opacity-50">
            Masuk
          </button>
        </form>
      </div>
      <a href="index.html" class="block text-center text-[11px] font-mono text-muted hover:text-cyan mt-4">← Kembali ke halaman voting</a>
    </div>
  </div>

  <!-- ============ DASHBOARD SCREEN ============ -->
  <div id="dashboard-screen" class="hidden">
    <header class="relative overflow-hidden border-b border-hairline">
      <div class="absolute inset-0 circuit-bg pointer-events-none"></div>
      <div class="relative max-w-6xl mx-auto px-6 pt-8 pb-6 flex flex-wrap items-start justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 text-xs font-mono text-cyan mb-3">
            <span class="w-2 h-2 rounded-full bg-cyan pulse-dot"></span>
            <span id="live-text">LIVE · AUTO-REFRESH 5s</span>
          </div>
          <h1 class="font-display font-bold text-3xl text-white">Rekap Suara<span class="text-cyan">.</span></h1>
        </div>
        <div class="flex items-center gap-2 text-xs font-mono">
          <a href="pendaftaran.html" class="px-3 py-2 rounded border border-hairline hover:border-cyan hover:text-cyan transition">+ Calon</a>
          <button id="btn-refresh" class="px-3 py-2 rounded border border-hairline hover:border-cyan hover:text-cyan transition">↻ Refresh</button>
          <button id="btn-logout" class="px-3 py-2 rounded border border-hairline hover:border-red-400 hover:text-red-400 transition">Keluar</button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 py-8 space-y-8">
      <!-- Ringkasan Statistik -->
      <section class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-surface border border-hairline rounded-xl p-5">
          <p class="text-xs font-mono text-muted mb-2">TOTAL_SUARA</p>
          <p id="stat-total" class="font-display text-3xl text-white">0</p>
        </div>
        <div class="bg-surface border border-hairline rounded-xl p-5">
          <p class="text-xs font-mono text-muted mb-2">KANDIDAT</p>
          <p id="stat-candidates" class="font-display text-3xl text-white">0</p>
        </div>
        <div class="bg-surface border border-hairline rounded-xl p-5 col-span-2 sm:col-span-1">
          <p class="text-xs font-mono text-muted mb-2">TERDEPAN</p>
          <p id="stat-leader" class="font-display text-lg text-cyan truncate">-</p>
        </div>
        <div class="bg-surface border border-hairline rounded-xl p-5">
          <p class="text-xs font-mono text-muted mb-2">SELISIH</p>
          <p id="stat-margin" class="font-display text-3xl text-white">0</p>
        </div>
      </section>

      <!-- Grafik/Bar Suara -->
      <section>
        <h2 class="font-display text-xl text-white mb-4">Perolehan Suara</h2>
        <div id="results-list" class="space-y-4"></div>
      </section>

      <!-- Audit Log Pemilih -->
      <section>
        <h2 class="font-display text-xl text-white mb-4">Log Pemilih</h2>
        <div class="border border-hairline rounded-xl overflow-x-auto bg-surface">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-xs font-mono text-muted border-b border-hairline">
                <th class="px-4 py-3">Waktu</th>
                <th class="px-4 py-3">NIM</th>
                <th class="px-4 py-3">Nama</th>
                <th class="px-4 py-3">Pilihan</th>
              </tr>
            </thead>
            <tbody id="audit-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://gvymeyyozglpljpgdbfi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd2eW1leXlvemdscGxqcGdkYmZpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMzc0ODksImV4cCI6MjEwMDkxMzQ4OX0.2jM9Nf-0sVO9AKAkXIAEuSmlV0TIYVR_32umrehhGLw';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let candidatesCache = [];
    let refreshTimer = null;

    // Cek Session Saat Pertama Kali Buka Halaman
    async function initAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    }

    // Listener Perubahan Status Login
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        showDashboard();
      } else {
        showLogin();
      }
    });

    function showLogin() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('dashboard-screen').classList.add('hidden');
      if (refreshTimer) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      }
    }

    function showDashboard() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      loadData();
      if (!refreshTimer) {
        refreshTimer = setInterval(loadData, 5000);
      }
    }

    // Process Login Form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const msg = document.getElementById('login-message');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      msg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      btn.disabled = false;
      btn.textContent = 'Masuk';

      if (error) {
        msg.textContent = 'Gagal masuk: ' + error.message;
        msg.classList.remove('hidden');
      } else {
        showDashboard();
      }
    });

    // Logout Action
    document.getElementById('btn-logout').addEventListener('click', async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    // Load Data Real-time
    async function loadData() {
      try {
        const [{ data: results, error: resErr }, { data: candidates, error: candErr }, { data: votes, error: voteErr }] = await Promise.all([
          supabase.rpc('get_results'),
          supabase.from('candidates').select('*').order('nomor_urut'),
          supabase.from('votes').select('voter_nim, voter_nama, candidate_id, created_at').order('created_at', { ascending: false })
        ]);

        if (resErr) console.error('Error fetching results:', resErr);
        if (candErr) console.error('Error fetching candidates:', candErr);
        if (voteErr) console.error('Error fetching votes:', voteErr);

        candidatesCache = candidates || [];
        renderStats(results || []);
        renderResults(results || []);
        renderAudit(votes || []);
      } catch (err) {
        console.error('Data Error:', err);
      }
    }

    function renderStats(rows) {
      const total = rows.reduce((s, r) => s + Number(r.total_votes), 0);
      const sorted = [...rows].sort((a, b) => Number(b.total_votes) - Number(a.total_votes));
      const leader = sorted[0];
      const runnerUp = sorted[1];
      const margin = leader && runnerUp ? Number(leader.total_votes) - Number(runnerUp.total_votes) : (leader ? Number(leader.total_votes) : 0);

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-candidates').textContent = rows.length;
      document.getElementById('stat-leader').textContent = leader && total > 0 ? `#${leader.nomor_urut} ${leader.nama_ketua}` : '-';
      document.getElementById('stat-margin').textContent = total > 0 ? margin : 0;
    }

    function renderResults(rows) {
      const list = document.getElementById('results-list');
      const total = rows.reduce((s, r) => s + Number(r.total_votes), 0);
      const maxVotes = Math.max(0, ...rows.map(r => Number(r.total_votes)));

      list.innerHTML = rows.map(r => {
        const votes = Number(r.total_votes);
        const pct = total > 0 ? Math.round((votes / total) * 1000) / 10 : 0;
        const isLeading = votes > 0 && votes === maxVotes;
        return `
          <div class="bg-surface border ${isLeading ? 'border-cyan/50' : 'border-hairline'} rounded-xl p-4">
            <div class="flex justify-between items-baseline mb-2 text-sm">
              <span class="text-white"><span class="font-mono text-cyan">#${r.nomor_urut}</span> ${r.nama_ketua}</span>
              <span class="font-mono text-xs text-muted">${votes} suara · ${pct}%</span>
            </div>
            <div class="h-2 rounded-full bg-surface2 border border-hairline overflow-hidden">
              <div class="bar-fill h-full rounded-full ${isLeading ? 'bg-cyan bar-glow' : 'bg-cyan/50'}" style="width:${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderAudit(rows) {
      const body = document.getElementById('audit-body');
      const candMap = Object.fromEntries(candidatesCache.map(c => [c.id, c]));

      if (rows.length === 0) {
        body.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-muted font-mono text-xs">Belum ada suara yang masuk.</td></tr>`;
        return;
      }

      body.innerHTML = rows.map(v => {
        const c = candMap[v.candidate_id];
        return `
          <tr class="border-b border-hairline/60 text-xs">
            <td class="px-4 py-2.5 font-mono text-muted">${new Date(v.created_at).toLocaleString('id-ID')}</td>
            <td class="px-4 py-2.5 font-mono text-white">${v.voter_nim}</td>
            <td class="px-4 py-2.5 text-white">${v.voter_nama}</td>
            <td class="px-4 py-2.5 text-cyan">${c ? '#' + c.nomor_urut + ' ' + c.nama_ketua : '—'}</td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('btn-refresh').addEventListener('click', loadData);

    // Jalankan pemeriksaan awal
    initAuth();
  </script>
</body>
</html>
